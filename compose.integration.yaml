# Disposable database for integration tests; independent of the site's volumes.
services:
  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_DB: rustpress_test
      POSTGRES_USER: rustpress_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set a generated URL-safe test database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-0}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustpress_test -d rustpress_test"]
      interval: 1s
      timeout: 3s
      retries: 60
    security_opt: ["no-new-privileges:true"]
